spring:
  config:
    import: "optional:configserver:"
  mail:
    host: localhost
    port: 25
  cloud:
    config:
      enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
  security:
    oauth2:
      resourceserver:
        opaquetoken:
          introspection-uri: http://localhost:5000/uaa/oauth2/introspect
          client-id: notification-service
          client-secret: test
      client:
        registration:
          notification-service:
            client-id: notification-service
            client-secret: test
            authorization-grant-type: client_credentials
            scope: server
        provider:
          notification-service:
            token-uri: http://localhost:5000/uaa/oauth2/token

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 6.0.9

remind:
  cron: "0 0 0 * * *"
  email:
    text: test
    subject: test

backup:
  cron: "0 0 12 * * *"
  email:
    text: test
    subject: test
    attachment: backup.json
